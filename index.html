<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/desert-forest-logo.svg" />
    <link rel="preload" as="image" href="/desert-forest-logo.svg" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-400-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-latin-600-normal.woff2" crossorigin />
    <meta name="theme-color" content="#4b553e" />
    <meta name="description" content="Order cakes, pastries, desserts and gift hampers from Desert Forest, Coimbatore's forest-inspired bakery and dessert house." />
    <title>Desert Forest — Cakes, Desserts and Celebrations in Coimbatore</title>
    <style>
      /* Splash shown until the app has rendered (removed in src/main.jsx). */
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#f5efe2;transition:opacity .45s ease,visibility .45s ease}
      #splash.is-done{opacity:0;visibility:hidden;pointer-events:none}
      #splash .sp-logo{width:min(220px,58vw);height:auto;animation:sp-breathe 1.8s ease-in-out infinite}
      #splash .sp-dots{display:flex;gap:8px}
      #splash .sp-dots i{width:9px;height:9px;border-radius:50%;background:#4b553e;animation:sp-bounce 1.1s ease-in-out infinite}
      #splash .sp-dots i:nth-child(2){animation-delay:.15s;background:#7d8a5f}
      #splash .sp-dots i:nth-child(3){animation-delay:.3s;background:#c9a56b}
      @keyframes sp-breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.85}}
      @keyframes sp-bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-9px);opacity:1}}
      @media (prefers-reduced-motion:reduce){#splash .sp-logo,#splash .sp-dots i{animation:none}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Desert Forest">
      <img class="sp-logo" src="/desert-forest-logo.svg" alt="" width="360" height="120" />
      <div class="sp-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
